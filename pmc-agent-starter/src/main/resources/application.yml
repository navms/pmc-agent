spring:
  application:
    name: pmc-agent
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/pmc-agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:dev}
    password: ${MYSQL_PASSWORD:devpass}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

pmc:
  artifact:
    export-dir: ${PMC_EXPORT_DIR:./data/exports}
  agent:
    api-key: ${AI_DASHSCOPE_API_KEY:sk-ws-H.PDXIEXY.11Ic.MEUCIQDhk2CvtVh6XoDh5UTpAPLpA1QgM5vjf6Aj4ruFzeLoSAIgJ945-S-kf3L7p404sy06SZHPuqDzC1B-ivz26CR8vHM}
    model: ${AI_MODEL:deepseek-v4-flash-0731}
    spawn-timeout-seconds: 120
    state-dir: ${PMC_AGENT_STATE_DIR:./data/agentscope/state}
    workspace-dir: ${PMC_AGENT_WORKSPACE_DIR:./data/agentscope/workspace}

agentscope:
  agui:
    path-prefix: /agui
    default-agent-id: pmc_supervisor
    enable-path-routing: false
    enable-reasoning: true
    emit-token-usage: true
    emit-tool-call-args: true
    server-side-memory: false
    cors-enabled: false
    default-tool-merge-mode: AGENT_ONLY

server:
  port: 8080
