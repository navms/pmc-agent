spring:
  application:
    name: pmc-agent
  datasource:
    # openTelemetry=DISABLED：避免 MySQL Connector/J 在建连时抢先 GlobalOpenTelemetry.get()，
    # 导致后续 Langfuse buildAndRegisterGlobal 失败（与 Quarkus #51456 同根因）。
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/pmc-agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true&openTelemetry=DISABLED
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:224608}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      data-source-properties:
        openTelemetry: DISABLED

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

pmc:
  artifact:
    export-dir: ${PMC_EXPORT_DIR:./data/exports}
  agent:
    api-key: ${AI_DASHSCOPE_API_KEY:sk-ws-H.PDXIEXY.11Ic.MEUCIQDhk2CvtVh6XoDh5UTpAPLpA1QgM5vjf6Aj4ruFzeLoSAIgJ945-S-kf3L7p404sy06SZHPuqDzC1B-ivz26CR8vHM}
    model: ${AI_MODEL:qwen3.7-flash-2026-07-15}
  langfuse:
    enabled: ${LANGFUSE_ENABLED:true}
    host: ${LANGFUSE_HOST:http://127.0.0.1:3000}
    public-key: ${LANGFUSE_PUBLIC_KEY:pk-lf-1234567890}
    secret-key: ${LANGFUSE_SECRET_KEY:sk-lf-1234567890}
    prompt-label: ${LANGFUSE_PROMPT_LABEL:production}
    prompt-cache-ttl-seconds: ${LANGFUSE_PROMPT_CACHE_TTL:60}
    prompt-seed: ${LANGFUSE_PROMPT_SEED:true}
    base-case-dataset: ${LANGFUSE_BASE_CASE_DATASET:base-case}

agentscope:
  agui:
    path-prefix: /agui
    default-agent-id: pmc_supervisor
    enable-path-routing: false
    enable-reasoning: true
    emit-token-usage: true
    emit-tool-call-args: true
    server-side-memory: false
    cors-enabled: false
    default-tool-merge-mode: AGENT_ONLY

server:
  port: 8080
